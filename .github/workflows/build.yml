name: Build MyVoice (deb + dylib)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: brew install dpkg ldid

      - name: Setup theos
        run: git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Vendor Flite (真实离线TTS，失败则回退 Sine 占位)
        run: bash flite/vendor.sh || echo "::warning::flite vendor 失败，使用内置 Sine 占位"

      - name: Build rootless deb
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myvoice
          path: |
            packages/*.deb
            .theos/artifacts/MyVoice.dylib
