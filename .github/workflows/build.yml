name: Build MyVoice (deb + dylib)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: brew install dpkg ldid

      - name: Setup theos
        run: git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Vendor Flite (真实离线TTS，失败则回退 Sine 占位)
        run: bash flite/vendor.sh || echo "::warning::flite vendor 失败，使用内置 Sine 占位"

      - name: Normalize control line endings (防止 CRLF 导致打包失败)
        run: sed -i '' 's/\r$//' control

      - name: Build dylib (未 strip，供崩溃符号化)
        run: make THEOS_PACKAGE_SCHEME=rootless || true

      - name: 收集未 strip 的 MyVoice.dylib
        if: always()
        run: |
          mkdir -p out
          find .theos -name 'MyVoice.dylib' -exec cp -v {} out/ \;
          cp -v MyVoice.plist out/ 2>/dev/null || true
          ls -la out || true

      - name: Build rootless deb
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myvoice
          path: |
            packages/*.deb
            out/*.dylib
            .theos/artifacts/MyVoice.dylib
